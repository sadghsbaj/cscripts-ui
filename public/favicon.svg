<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Geometric C Stroke Gradient -->
    <linearGradient id="cG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Accent Token Gradient -->
    <linearGradient id="nodeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Subtle Design-System Grid Lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Geometric "C" Frame -->
  <path d="M 42.6 21.4 A 15 15 0 1 0 42.6 42.6" fill="none" stroke="url(#cG)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Glowing UI Token / Component Node -->
  <circle cx="43" cy="32" r="6" fill="#38bdf8" opacity="0.25"/>
  <circle cx="43" cy="32" r="3.5" fill="url(#nodeG)"/>
  <circle cx="43" cy="32" r="1.4" fill="#ffffff"/>
</svg>
