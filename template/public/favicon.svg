<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>

    <!-- Neutral Slate Base "C" Gradient -->
    <linearGradient id="baseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgG)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Subtle Blueprint Grid Lines -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Minimalist Monochrome "C" Base Mark -->
  <path d="M 43.6 21.4 A 15 15 0 1 0 43.6 42.6" fill="none" stroke="url(#baseG)" stroke-width="6.5" stroke-linecap="round"/>
</svg>
